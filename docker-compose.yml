version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: paytask-postgres
    environment:
      POSTGRES_DB: paytask
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: subin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: paytask-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
