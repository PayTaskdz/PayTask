version: '3.8'

services:
  fastify-api:
    image: login-wallet-fastify:latest
    container_name: login-fastify-api
    ports:
      - "3000:3000"  # Port mapping cho Fastify
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/login_opaque_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - auth-network
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: login-fastify-postgres
    environment:
      POSTGRES_DB: login_opaque_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5434:5432"  # Port khác để không conflict
    volumes:
      - postgres_data_fastify:/var/lib/postgresql/data
    networks:
      - auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: login-fastify-redis
    ports:
      - "6381:6379"  # Port khác để không conflict
    volumes:
      - redis_data_fastify:/data
    networks:
      - auth-network
    restart: unless-stopped
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}

volumes:
  postgres_data_fastify:
  redis_data_fastify:

networks:
  auth-network:
    driver: bridge
